<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Join Channel</title>
		<script src="sdpi-components.js"></script>
		<link rel="stylesheet" href="status.css" />
	</head>

	<body>
		<!--
			The channels come from the plugin ("getChannels"), grouped by server, and are sent
			again whenever Refract's list changes. The chosen channel's name is saved beside its
			id, so the key can show it while Refract is closed.
		-->
		<sdpi-item label="Channel">
			<sdpi-select
				setting="channelId"
				value-type="number"
				label-setting="channelName"
				datasource="getChannels"
				hot-reload
				show-refresh
				placeholder="Choose a voice channel"
				loading="Loading channels…"
			></sdpi-select>
		</sdpi-item>

		<sdpi-item label="Press Again">
			<sdpi-checkbox setting="stayConnected" label="Stay connected instead of leaving"></sdpi-checkbox>
		</sdpi-item>

		<div id="status" hidden><i></i><span></span></div>
		<script src="status.js"></script>
	</body>
</html>
